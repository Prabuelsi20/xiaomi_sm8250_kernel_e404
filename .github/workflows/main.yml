name: Build E404 Kernel (Alioth)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Clone KernelSU
        run: |
          rm -rf KernelSU
          git clone --depth=1 https://github.com/tiann/KernelSU.git KernelSU

      - name: Verify KernelSU
        run: |
          ls -la KernelSU
          ls -la KernelSU/kernel
          ls -la drivers/kernelsu

      - name: Install Dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            bc \
            bison \
            build-essential \
            ccache \
            curl \
            flex \
            git \
            libssl-dev \
            libelf-dev \
            lzop \
            python3 \
            zip \
            unzip \
            clang \
            lld \
            gcc-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi

      - name: Check Compiler
        run: |
          which clang
          clang --version
          which aarch64-linux-gnu-gcc
          which arm-linux-gnueabi-gcc
          uname -m

      - name: Generate Defconfig
        run: |
          make O=out ARCH=arm64 vendor/alioth_defconfig

      - name: Build Kernel
        run: |
          make -j$(nproc) \
            O=out \
            ARCH=arm64 \
            CC=clang \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_COMPAT=arm-linux-gnueabi- \
            LLVM=1 \
            LLVM_IAS=1

      - name: Upload Kernel Files
        uses: actions/upload-artifact@v4
        with:
          name: alioth-kernel
          path: |
            out/arch/arm64/boot/Image
            out/arch/arm64/boot/dtb
            out/arch/arm64/boot/dtbo.img
