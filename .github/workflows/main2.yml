name: Build Kernel (alioth) 2

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Kernel
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4

      - name: Clone KernelSU
        run: |
          rm -rf KernelSU
          git clone --depth=1 https://github.com/tiann/KernelSU.git KernelSU

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential bc bison flex libssl-dev libelf-dev \
            ccache zip unzip curl git make clang lld \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

      - name: Cache Neutron Clang
        id: cache-toolchain
        uses: actions/cache@v4
        with:
          path: ../toolchains/neutron-clang
          key: ${{ runner.os }}-neutron-clang-v1

      - name: Download Neutron Clang (if not cached)
        if: steps.cache-toolchain.outputs.cache-hit != 'true'
        run: |
          mkdir -p ../toolchains/neutron-clang
          cd ../toolchains/neutron-clang
          curl -sSLo antman https://raw.githubusercontent.com/Neutron-Toolchains/neutron-clang/main/antman
          chmod +x antman
          ./antman -S=latest --noconfirm

      - name: Patch glibc for Neutron Clang
        run: |
          cd ../toolchains/neutron-clang
          ./antman --patch=glibc || true

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ../ccache
          key: ${{ runner.os }}-ccache-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-ccache-

      - name: Setup AnyKernel3
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git ../AnyKernel3

      - name: Create Telegram Config
        run: |
          cat > ../telegram_api <<'EOF'
          BOT_TOKEN=dummy
          GROUP_ID=0
          CHANNEL_ID=0
          PRIVATE_ID=0
          EOF
          echo "GitHub Actions build" > ../kernel_changelog.txt

      - name: Build Kernel
        run: |
          set -e
          export CCACHE_DIR="$PWD/../ccache/.kernel-bpf"
          ccache -M 5G
          bash compile.sh alioth neutron

      - name: Upload Kernel Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: E404-alioth-Kernel
          path: |
            out/*.zip
            out/kernel_compile.log
